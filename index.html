<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Blinkit — iPhone 17 Quick Commerce Experience</title>
  
  <!-- Preconnect and Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }

    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* iPhone 17 Outer Hardware Frame */
    .iphone-17-case {
      width: 402px;
      height: 874px;
      border-radius: 54px;
      padding: 10px;
      background: linear-gradient(145deg, #2a2e39 0%, #151821 50%, #222631 100%);
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.18) inset,
        0 0 0 3px rgba(0, 0, 0, 0.8) inset,
        0 25px 60px -15px rgba(0, 0, 0, 0.85),
        0 10px 25px rgba(0, 0, 0, 0.5);
      position: relative;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Side Hardware Buttons on iPhone 17 */
    .iphone-btn-action {
      position: absolute;
      left: -13px;
      top: 115px;
      width: 4px;
      height: 28px;
      background: #3a3f4d;
      border-radius: 3px 0 0 3px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .iphone-btn-vol-up {
      position: absolute;
      left: -13px;
      top: 160px;
      width: 4px;
      height: 52px;
      background: #3a3f4d;
      border-radius: 3px 0 0 3px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .iphone-btn-vol-down {
      position: absolute;
      left: -13px;
      top: 224px;
      width: 4px;
      height: 52px;
      background: #3a3f4d;
      border-radius: 3px 0 0 3px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .iphone-btn-power {
      position: absolute;
      right: -13px;
      top: 175px;
      width: 4px;
      height: 72px;
      background: #3a3f4d;
      border-radius: 0 3px 3px 0;
      box-shadow: 1px 0 2px rgba(0,0,0,0.5);
    }

    /* Inner Screen OLED Display */
    .iphone-screen-oled {
      width: 100%;
      height: 100%;
      border-radius: 46px;
      overflow: hidden;
      position: relative;
      background-color: #f8f9ff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.95);
    }

    /* Dynamic Island */
    .dynamic-island {
      width: 122px;
      height: 34px;
      background-color: #000000;
      border-radius: 9999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dynamic-island:hover {
      transform: scale(1.04);
    }
    .dynamic-island-expanded {
      width: 220px;
      height: 44px;
    }

    /* Actual Mobile View (removes chassis on actual phones) */
    @media (max-width: 640px) {
      body {
        background-color: #f8f9ff !important;
      }
      .iphone-stage {
        padding: 0 !important;
        margin: 0 !important;
        min-height: 100vh !important;
      }
      .iphone-17-case {
        width: 100vw !important;
        height: 100vh !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
        border-radius: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
      }
      .iphone-btn-action,
      .iphone-btn-vol-up,
      .iphone-btn-vol-down,
      .iphone-btn-power {
        display: none !important;
      }
      .iphone-screen-oled {
        border-radius: 0 !important;
      }
    }
  </style>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'primary': '#006714',
            'primary-container': '#0c831f',
            'on-primary': '#ffffff',
            'on-primary-container': '#e0ffd7',
            'primary-fixed': '#8ffb87',
            'primary-fixed-dim': '#74dd6e',
            'on-primary-fixed': '#002203',
            'on-primary-fixed-variant': '#00530e',

            'secondary': '#a83900',
            'secondary-container': '#fc6018',
            'on-secondary': '#ffffff',
            'on-secondary-container': '#531800',
            'secondary-fixed': '#ffdbcf',
            'secondary-fixed-dim': '#ffb59a',
            'on-secondary-fixed': '#380d00',
            'on-secondary-fixed-variant': '#802a00',

            'tertiary': '#12661e',
            'tertiary-container': '#318035',
            'on-tertiary': '#ffffff',
            'on-tertiary-container': '#dfffd6',
            'tertiary-fixed': '#a3f69c',
            'tertiary-fixed-dim': '#88d982',

            'surface': '#f8f9ff',
            'surface-bright': '#f8f9ff',
            'surface-dim': '#d0dbed',
            'surface-variant': '#d9e3f6',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#eff4ff',
            'surface-container': '#e6eeff',
            'surface-container-high': '#dee9fc',
            'surface-container-highest': '#d9e3f6',

            'on-surface': '#121c2a',
            'on-surface-variant': '#3f4a3c',
            'outline': '#6f7a6a',
            'outline-variant': '#becab7',
            'background': '#f8f9ff',
            'on-background': '#121c2a',

            'error': '#ba1a1a',
            'error-container': '#ffdad6',
            'on-error': '#ffffff',
            'on-error-container': '#93000a',
          },
          borderRadius: {
            'DEFAULT': '0.25rem',
            'lg': '0.5rem',
            'xl': '0.75rem',
            '2xl': '1rem',
            'full': '9999px'
          },
          spacing: {
            'spacing-xxs': '0.125rem',
            'spacing-xs': '0.25rem',
            'spacing-sm': '0.5rem',
            'spacing-md': '0.75rem',
            'spacing-lg': '1rem',
            'spacing-xl': '1.25rem',
            'spacing-2xl': '1.5rem',
            'spacing-3xl': '2rem',
            'margin-screen': '0.75rem',
            'card-pad-horizontal': '0.5rem',
            'card-pad-vertical': '0.625rem',
            'gutter-grid': '0.5rem'
          },
          fontFamily: {
            'body-sm': ['Inter', 'sans-serif'],
            'body-md': ['Inter', 'sans-serif'],
            'body-lg': ['Inter', 'sans-serif'],
            'label-sm': ['Inter', 'sans-serif'],
            'label-md': ['Inter', 'sans-serif'],
            'label-lg': ['Inter', 'sans-serif'],
            'title-md': ['Inter', 'sans-serif'],
            'headline-sm': ['Inter', 'sans-serif'],
            'headline-md': ['Inter', 'sans-serif'],
            'headline-lg': ['Inter', 'sans-serif'],
            'price-headline': ['Inter', 'sans-serif'],
            'price-strikethrough': ['Inter', 'sans-serif']
          },
          fontSize: {
            'body-sm': ['11px', { lineHeight: '14px', fontWeight: '400' }],
            'body-md': ['13px', { lineHeight: '18px', fontWeight: '400' }],
            'body-lg': ['15px', { lineHeight: '22px', fontWeight: '400' }],
            'label-sm': ['10px', { lineHeight: '12px', letterSpacing: '0.03em', fontWeight: '700' }],
            'label-md': ['11px', { lineHeight: '14px', letterSpacing: '0.02em', fontWeight: '700' }],
            'label-lg': ['13px', { lineHeight: '16px', letterSpacing: '0.01em', fontWeight: '600' }],
            'title-md': ['15px', { lineHeight: '20px', fontWeight: '600' }],
            'headline-sm': ['17px', { lineHeight: '22px', fontWeight: '600' }],
            'headline-md': ['20px', { lineHeight: '26px', letterSpacing: '-0.01em', fontWeight: '700' }],
            'headline-lg': ['24px', { lineHeight: '32px', letterSpacing: '-0.02em', fontWeight: '700' }],
            'price-headline': ['14px', { lineHeight: '18px', fontWeight: '700' }],
            'price-strikethrough': ['11px', { lineHeight: '14px', fontWeight: '400' }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-950 font-body-md text-body-md text-on-surface flex flex-col min-h-screen antialiased select-none">
  
  <!-- Dev Bar (Top screen selector & preview tools) -->
  <div id="dev-toolbar-container"></div>

  <!-- Stage Area (Centers and frames the iPhone 17) -->
  <div id="iphone-stage" class="iphone-stage flex-1 flex items-center justify-center py-6 px-4 overflow-hidden">
    
    <!-- iPhone 17 Hardware Shell -->
    <div id="device-frame-shell" class="iphone-17-case">
      
      <!-- Side Hardware Buttons -->
      <div class="iphone-btn-action"></div>
      <div class="iphone-btn-vol-up"></div>
      <div class="iphone-btn-vol-down"></div>
      <div class="iphone-btn-power"></div>

      <!-- OLED Inner Screen Display -->
      <div class="iphone-screen-oled">
        
        <!-- iOS Status Bar & Dynamic Island (Pinned at top of iPhone) -->
        <div class="w-full h-11 bg-surface-container-lowest/95 backdrop-blur-md pt-2 px-6 flex items-center justify-between shrink-0 z-50 select-none">
          <!-- Live Time -->
          <div class="w-16">
            <span id="iosClock" class="font-bold text-[14px] text-gray-900 tracking-tight">9:41</span>
          </div>

          <!-- Dynamic Island Capsule with Live Activity -->
          <div id="dynamicIsland" class="dynamic-island">
            <div class="flex items-center gap-1.5">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <span class="text-[11px] font-bold text-emerald-400 tracking-tight">⚡ 12m</span>
            </div>
            <!-- Front Camera Lens reflection -->
            <div class="w-3 h-3 rounded-full bg-slate-900 border border-slate-700/80 flex items-center justify-center">
              <div class="w-1 h-1 rounded-full bg-blue-950"></div>
            </div>
          </div>

          <!-- Cellular, WiFi, Battery -->
          <div class="w-16 flex items-center justify-end gap-1.5 text-gray-900">
            <!-- Cellular -->
            <span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
            <!-- WiFi -->
            <span class="material-symbols-outlined text-[15px]">wifi</span>
            <!-- Battery -->
            <div class="w-5 h-2.5 rounded-sm border border-gray-900 p-0.5 flex items-center relative">
              <div class="h-full w-full bg-emerald-600 rounded-[1px]"></div>
              <div class="absolute -right-1 top-0.5 w-0.5 h-1 bg-gray-900 rounded-r-xs"></div>
            </div>
          </div>
        </div>

        <!-- Scrollable Inner Viewport Container (contains headers, screens, and lists) -->
        <div id="screen-scroll-viewport" class="w-full flex-1 overflow-y-auto overflow-x-hidden relative flex flex-col no-scrollbar">
          <!-- Screen Component Mount -->
          <div id="screen-container" class="w-full flex-1 flex flex-col relative"></div>
        </div>

        <!-- Pinned Bottom Navigation Slot -->
        <div id="bottom-nav-container" class="shrink-0 z-40 bg-surface-container-lowest/95 backdrop-blur-md"></div>

        <!-- iOS Bottom Home Indicator Swipe Bar -->
        <div class="w-full h-5 bg-surface-container-lowest flex items-center justify-center shrink-0 z-50">
          <div class="w-32 h-1 bg-gray-900/60 rounded-full"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Live Clock Script -->
  <script>
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      minutes = minutes < 10 ? '0' + minutes : minutes;
      const clockEl = document.getElementById('iosClock');
      if (clockEl) {
        clockEl.textContent = `${hours}:${minutes}`;
      }
    }
    updateClock();
    setInterval(updateClock, 10000);
  </script>

  <!-- App Entry Script -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
