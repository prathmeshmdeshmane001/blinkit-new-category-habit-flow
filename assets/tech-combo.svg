<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#techBg)"/>
  
  <!-- Desk Phone Stand -->
  <path d="M125 155l30-75h25l-20 75z" fill="#64748b"/>
  <rect x="110" y="152" width="70" height="8" rx="3" fill="#475569"/>
  <!-- Phone on Stand -->
  <rect x="150" y="55" width="55" height="95" rx="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(2,132,199,0.3))"/>
  <circle cx="177" cy="62" r="3" fill="#0369a1"/>
  <path d="M177 88l-6 12h8l-4 12 10-14h-8z" fill="#38bdf8"/>

  <!-- 20W Power Adapter -->
  <rect x="65" y="80" width="46" height="52" rx="8" fill="#ffffff" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.3))"/>
  <rect x="75" y="70" width="8" height="12" rx="2" fill="#94a3b8"/>
  <rect x="93" y="70" width="8" height="12" rx="2" fill="#94a3b8"/>
  <rect x="80" y="112" width="16" height="6" rx="2" fill="#0284c7"/>
  <text x="88" y="103" font-family="sans-serif" font-size="7" font-weight="900" fill="#0f172a" text-anchor="middle">20W PD</text>

  <!-- Fast Braided Cable -->
  <path d="M88 118c0 30 70 45 130 15s30-50 45-40" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 3"/>
  <rect x="255" y="85" width="22" height="10" rx="3" fill="#ffffff" transform="rotate(-30 255 85)"/>
  <rect x="272" y="87" width="8" height="6" rx="1.5" fill="#cbd5e1" transform="rotate(-30 255 85)"/>

  <!-- 65W Fast Charge Pill -->
  <rect x="210" y="25" width="85" height="22" rx="11" fill="#38bdf8"/>
  <text x="252" y="39" font-family="sans-serif" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">65W FAST CHARGE</text>
</svg>
