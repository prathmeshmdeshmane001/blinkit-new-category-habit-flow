<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="beautyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="50%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="serumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#beautyBg)"/>
  
  <!-- Subtle decorative bubbles -->
  <circle cx="60" cy="40" r="18" fill="#f43f5e" opacity="0.1"/>
  <circle cx="270" cy="50" r="24" fill="#ec4899" opacity="0.15"/>
  <circle cx="290" cy="150" r="30" fill="#10b981" opacity="0.1"/>

  <!-- Pedestal -->
  <ellipse cx="160" cy="165" rx="100" ry="20" fill="#f472b6" opacity="0.3"/>

  <!-- Skincare Bottle 1: Cleanser -->
  <rect x="110" y="60" width="46" height="90" rx="12" fill="url(#bottleGrad)" filter="drop-shadow(0 8px 12px rgba(219,39,119,0.25))"/>
  <rect x="122" y="44" width="22" height="18" rx="4" fill="#ffffff"/>
  <rect x="127" y="38" width="12" height="8" rx="2" fill="#fda4af"/>
  <rect x="118" y="80" width="30" height="36" rx="6" fill="#ffffff" opacity="0.9"/>
  <text x="133" y="102" font-family="sans-serif" font-size="9" font-weight="900" fill="#db2777" text-anchor="middle">GLOW</text>

  <!-- Serum Dropper Bottle 2: Vitamin C -->
  <rect x="170" y="75" width="40" height="75" rx="10" fill="url(#serumGrad)" filter="drop-shadow(0 8px 12px rgba(5,150,105,0.25))"/>
  <rect x="180" y="60" width="20" height="16" rx="4" fill="#ffffff"/>
  <path d="M190 42c-4 0-7 5-7 18h14c0-13-3-18-7-18z" fill="#065f46"/>
  <rect x="177" y="94" width="26" height="30" rx="4" fill="#ffffff" opacity="0.9"/>
  <text x="190" y="112" font-family="sans-serif" font-size="8" font-weight="900" fill="#059669" text-anchor="middle">VIT-C</text>

  <!-- Sparkles -->
  <path d="M75 80l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#fbbf24"/>
  <path d="M245 95l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#fbbf24"/>
</svg>
