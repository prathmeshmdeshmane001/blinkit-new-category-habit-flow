<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="coldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="balmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#coldBg)"/>
  
  <!-- Steam Balm Tub -->
  <rect x="80" y="90" width="70" height="60" rx="14" fill="url(#balmGrad)" filter="drop-shadow(0 8px 12px rgba(2,132,199,0.25))"/>
  <rect x="75" y="76" width="80" height="18" rx="8" fill="#38bdf8"/>
  <circle cx="115" cy="120" r="16" fill="#ffffff" opacity="0.9"/>
  <text x="115" y="124" font-family="sans-serif" font-size="8" font-weight="900" fill="#0369a1" text-anchor="middle">RELIEF</text>
  
  <!-- Steam clouds -->
  <path d="M100 65c-4-8 4-15 0-22M115 65c-4-8 4-15 0-22M130 65c-4-8 4-15 0-22" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Vitamin C Tube -->
  <rect x="180" y="60" width="34" height="95" rx="8" fill="#ea580c" filter="drop-shadow(0 8px 12px rgba(234,88,12,0.25))"/>
  <rect x="183" y="48" width="28" height="14" rx="4" fill="#fed7aa"/>
  <text x="197" y="105" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" transform="rotate(-90 197 105)">VITAMIN C</text>

  <!-- Lozenges Pack -->
  <rect x="235" y="95" width="50" height="60" rx="8" fill="#10b981"/>
  <circle cx="260" cy="120" r="10" fill="#ecfdf5"/>
  <path d="M260 114c-4 0-6 4-6 6s2 6 6 6 6-4 6-6-2-6-6-6z" fill="#059669"/>
  <text x="260" y="145" font-family="sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">TULSI</text>
</svg>
