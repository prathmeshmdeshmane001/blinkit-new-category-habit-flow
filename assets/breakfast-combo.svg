<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bfastBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bfastBg)"/>
  
  <!-- Milk Carton -->
  <g filter="drop-shadow(0 8px 12px rgba(16,185,129,0.2))">
    <rect x="75" y="65" width="55" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M75 65l12-18h31l12 18z" fill="#0284c7"/>
    <rect x="75" y="85" width="55" height="22" fill="#38bdf8"/>
    <text x="102" y="100" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">MILK 1L</text>
  </g>

  <!-- Whole Wheat Bread Loaf -->
  <g filter="drop-shadow(0 8px 12px rgba(180,83,9,0.2))">
    <rect x="145" y="80" width="75" height="75" rx="14" fill="#b45309"/>
    <rect x="148" y="83" width="69" height="69" rx="12" fill="#d97706"/>
    <circle cx="165" cy="100" r="3" fill="#92400e"/>
    <circle cx="190" cy="115" r="3" fill="#92400e"/>
    <circle cx="175" cy="130" r="3" fill="#92400e"/>
    <text x="182" y="145" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">WHEAT BREAD</text>
  </g>

  <!-- Brown Eggs -->
  <ellipse cx="245" cy="135" rx="14" ry="20" fill="#c2410c" transform="rotate(-15 245 135)"/>
  <ellipse cx="268" cy="140" rx="14" ry="20" fill="#ea580c" transform="rotate(10 268 140)"/>
</svg>
