<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="kitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#medBg)"/>

  <!-- First Aid Box -->
  <rect x="85" y="65" width="100" height="85" rx="16" fill="url(#kitGrad)" filter="drop-shadow(0 10px 15px rgba(220,38,38,0.25))"/>
  <rect x="115" y="50" width="40" height="18" rx="6" fill="none" stroke="#dc2626" stroke-width="5"/>
  <!-- White Cross -->
  <rect x="126" y="93" width="18" height="28" rx="3" fill="#ffffff"/>
  <rect x="121" y="98" width="28" height="18" rx="3" fill="#ffffff"/>

  <!-- Digital Thermometer -->
  <g transform="rotate(-35 220 100)" filter="drop-shadow(0 6px 10px rgba(0,0,0,0.15))">
    <rect x="200" y="50" width="18" height="95" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="206" y="138" width="6" height="18" rx="3" fill="#94a3b8"/>
    <rect x="204" y="68" width="10" height="18" rx="2" fill="#0284c7"/>
    <text x="209" y="80" font-family="monospace" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">98.6</text>
    <circle cx="209" cy="115" r="3.5" fill="#ef4444"/>
  </g>

  <!-- Antiseptic Spray & Bandages -->
  <rect x="45" y="85" width="28" height="65" rx="6" fill="#0284c7" filter="drop-shadow(0 4px 8px rgba(2,132,199,0.2))"/>
  <rect x="52" y="75" width="14" height="12" fill="#ffffff"/>
  <rect x="56" y="70" width="6" height="6" fill="#38bdf8"/>
  <text x="59" y="122" font-family="sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">SPRAY</text>

  <!-- Adhesive Bandage -->
  <rect x="235" y="125" width="55" height="20" rx="10" fill="#fed7aa" stroke="#fb923c" stroke-width="1" transform="rotate(15 250 130)"/>
  <circle cx="250" cy="130" r="1.5" fill="#ea580c"/>
  <circle cx="256" cy="132" r="1.5" fill="#ea580c"/>
  <circle cx="262" cy="134" r="1.5" fill="#ea580c"/>

  <!-- Emergency 24x7 badge -->
  <rect x="195" y="25" width="95" height="22" rx="11" fill="#10b981"/>
  <text x="242" y="39" font-family="sans-serif" font-size="9.5" font-weight="900" fill="#ffffff" text-anchor="middle">10 MIN DISPATCH</text>
</svg>
