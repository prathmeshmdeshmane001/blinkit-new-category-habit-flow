<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gymBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="chocoBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#gymBg)"/>
  
  <!-- Protein Bar 1: Yoga Bar -->
  <g transform="rotate(-15 110 100)" filter="drop-shadow(0 8px 12px rgba(69,26,3,0.25))">
    <rect x="60" y="70" width="110" height="42" rx="8" fill="url(#chocoBar)"/>
    <rect x="65" y="74" width="22" height="34" rx="4" fill="#f59e0b"/>
    <text x="76" y="94" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">20g</text>
    <text x="125" y="95" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">PROTEIN BAR</text>
  </g>

  <!-- Choco Nutty Cookies Stack -->
  <g filter="drop-shadow(0 8px 12px rgba(180,83,9,0.2))">
    <!-- Cookie 1 -->
    <circle cx="215" cy="130" r="32" fill="#d97706"/>
    <circle cx="205" cy="120" r="4" fill="#451a03"/>
    <circle cx="225" cy="125" r="3.5" fill="#451a03"/>
    <circle cx="215" cy="140" r="4" fill="#451a03"/>
    <circle cx="228" cy="138" r="3" fill="#fef3c7"/>
    <circle cx="200" cy="135" r="3" fill="#fef3c7"/>

    <!-- Cookie 2 overlapping -->
    <circle cx="245" cy="100" r="28" fill="#b45309"/>
    <circle cx="238" cy="92" r="3.5" fill="#451a03"/>
    <circle cx="254" cy="98" r="4" fill="#451a03"/>
    <circle cx="242" cy="108" r="3" fill="#fef3c7"/>
  </g>

  <!-- 40g Protein Stamp -->
  <rect x="25" y="25" width="105" height="24" rx="12" fill="#78350f"/>
  <text x="77" y="41" font-family="sans-serif" font-size="9.5" font-weight="900" fill="#ffffff" text-anchor="middle">⚡ 40g TOTAL PROTEIN</text>
</svg>
